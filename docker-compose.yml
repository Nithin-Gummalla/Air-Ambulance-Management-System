version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: air_ambulance_mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: air_ambulance_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - air_ambulance_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    container_name: air_ambulance_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/air_ambulance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - air_ambulance_network

  frontend:
    build: ./frontend
    container_name: air_ambulance_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - air_ambulance_network

volumes:
  mysql_data:

networks:
  air_ambulance_network:
    driver: bridge
