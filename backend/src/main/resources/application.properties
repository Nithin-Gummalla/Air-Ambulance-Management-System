spring.application.name=air-ambulance-backend
server.port=8080

# MySQL database configuration. Override these values with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/air_ambulance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret & Expiration Configuration
airambulance.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
airambulance.app.jwtExpirationMs=86400000
airambulance.app.jwtRefreshExpirationMs=604800000

# OpenAPI / Swagger Config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
